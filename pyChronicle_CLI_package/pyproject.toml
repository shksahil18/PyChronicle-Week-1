[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "pychronicle"
version = "0.4.0"
description = "AST-powered Python time-travel debugger"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "click>=8.1",
    "textual>=0.50",
    "rich>=13.0",
    "flask>=3.0",
    "gunicorn>=21.2"
]


[project.scripts]
pychronicle = "pychronicle.cli:cli"


[tool.setuptools.packages.find]
include = ["pychronicle*"]